# ================================================================
# Development Docker Compose Configuration
# Builds from local Dockerfile.dev with hot reload
# ================================================================

services:
  # ----------------------------------------------------------------
  # PostgreSQL Database (Backend)
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-backend_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL Database (Backend Tests — Isolated)
  # ----------------------------------------------------------------
  # Dedicated Postgres for the backend test suite. The suite calls
  # Base.metadata.drop_all() on tear-down, which would wipe the dev DB
  # if we pointed tests at `postgres`. This service lives on its own
  # volume and exposes a distinct host port (55433) so tests run via
  # `TEST_DATABASE_URL=postgresql://...@localhost:55433/...` in parallel
  # with a live dev environment.
  postgres-test:
    image: postgres:16-alpine
    container_name: postgres-test-dev
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-backend_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "${TEST_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL Database (Terraform Remote State)
  # ----------------------------------------------------------------
  # Worker-only Postgres for Terraform's `pg` backend. Deliberately
  # isolated from the application DB: the worker must never reach the
  # backend's data, only its own state store. One schema per deployment
  # (`deployment_<uuid>`) keeps the locking/state surface tight.
  postgres-tfstate:
    image: postgres:16-alpine
    container_name: postgres-tfstate-dev
    environment:
      POSTGRES_USER: ${TFSTATE_DB_USER:-terraform}
      POSTGRES_PASSWORD: ${TFSTATE_DB_PASSWORD:-terraform}
      POSTGRES_DB: ${TFSTATE_DB_NAME:-tfstate}
    volumes:
      - postgres_tfstate_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TFSTATE_DB_USER:-terraform}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL Database (Keycloak)
  # ----------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres-dev
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - keycloak-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Keycloak (Identity & Access Management)
  # ----------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-dev
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      
      # Admin Credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      
      # Development Settings
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    command:
      - start-dev
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - keycloak-network
      - frontend-network
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # RabbitMQ (Message Broker)
  # ----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-dev
    hostname: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Redis (Result Backend for Celery)
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    hostname: redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Backend API (FastAPI) - Development with Hot Reload
  # ----------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-backend_dev}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-12345}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      
      # Celery
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Git
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      
      # Keycloak
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dhbw}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-appstore-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}

      # LTI 1.3 (Moodle) — see app/utils/lti_auth.py. LTI_PLATFORM_JWKS_HOST_HEADER
      # is needed in dev because the backend container reaches Moodle via
      # host.docker.internal, which doesn't match the vhost Moodle's
      # wwwroot/iss actually matches on (localhost:8000).
      LTI_PLATFORM_ISSUER: ${LTI_PLATFORM_ISSUER:-}
      LTI_PLATFORM_JWKS_URL: ${LTI_PLATFORM_JWKS_URL:-}
      LTI_PLATFORM_JWKS_HOST_HEADER: ${LTI_PLATFORM_JWKS_HOST_HEADER:-}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-}
      LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID:-}
      LTI_SESSION_SECRET: ${LTI_SESSION_SECRET:-}

      # CORS
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]}'

      # Email (Gmail SMTP) — used by the post-deploy notify hook in
      # celery_event_listener.py. SMTP_ENABLED is the explicit
      # kill-switch (default false): even with SMTP_USER/SMTP_PASSWORD
      # populated, mail delivery only happens when SMTP_ENABLED=true.
      # Use it to keep credentials in .env for later but turn delivery
      # off in dev / CI / on demo days without scrubbing the creds.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Click-n-Deploy}

      # Public base URL of the frontend, used in owner-summary mails
      # to deep-link back to the deployment detail page.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}

      # Application
      DEBUG: "True"
      APP_NAME: ${APP_NAME:-Backend API Dev}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - ../backend:/app
      - /app/.venv
      - backend_git_repos:/tmp/repos
      # Mount shared SSH key for Git operations
      - ssh_keys:/root/.ssh:ro
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Worker Service (Celery) - Development
  # ----------------------------------------------------------------
  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile.dev
    container_name: worker-dev
    # Use host network to allow OpenStack API access
    # Note: This disables container network isolation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # Celery
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # OpenStack credential decryption (must match backend)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}

      # Terraform pg backend — isolated DB, NOT the application DB.
      # Worker uses one schema per deployment (deployment_<uuid>).
      TFSTATE_DATABASE_URL: postgresql://${TFSTATE_DB_USER:-terraform}:${TFSTATE_DB_PASSWORD:-terraform}@postgres-tfstate:5432/${TFSTATE_DB_NAME:-tfstate}?sslmode=disable

      # Git
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}

      # Application
      DEBUG: "True"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-tfstate:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - ../worker:/app
      - /app/.venv
      - worker_git_repos:/tmp/worker_repos
      # Mount shared SSH key for Git operations
      - ssh_keys:/root/.ssh:ro
    networks:
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Frontend (React/Next.js) - Development with Hot Reload
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    environment:
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      # Mount source code for hot reload
      - ../frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
      - /app/.next         # Prevent overwriting .next build folder
    networks:
      - frontend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # pgAdmin (Database Management UI) - Development Only
  # ----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local
  postgres_tfstate_data:
    driver: local
  keycloak_postgres_data:
    driver: local
  rabbitmq_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  backend_git_repos:
    driver: local
  worker_git_repos:
    driver: local
  ssh_keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSH_KEY_PATH:-$HOME/.ssh}

# ----------------------------------------------------------------
# Networks
# ----------------------------------------------------------------
networks:
  frontend-network:
    driver: bridge
    name: frontend-network-dev
  backend-network:
    driver: bridge
    name: backend-network-dev
  worker-network:
    driver: bridge
    name: worker-network-dev
  keycloak-network:
    driver: bridge
    name: keycloak-network-dev
