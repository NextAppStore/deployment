# ================================================================
# Development Docker Compose Configuration
# Builds from local Dockerfile.dev with hot reload
# ================================================================

services:
  # ----------------------------------------------------------------
  # PostgreSQL Database (Backend) — also the job queue and the
  # OpenTofu state; the only infrastructure backend and worker share
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-backend_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL Database (Backend Tests — Isolated)
  # ----------------------------------------------------------------
  # Dedicated Postgres for the backend test suite. The suite calls
  # Base.metadata.drop_all() on tear-down, which would wipe the dev DB
  # if we pointed tests at `postgres`. This service lives on its own
  # volume and exposes a distinct host port (55433) so tests run via
  # `TEST_DATABASE_URL=postgresql://...@localhost:55433/...` in parallel
  # with a live dev environment.
  postgres-test:
    image: postgres:16-alpine
    container_name: postgres-test-dev
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-backend_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "${TEST_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # PostgreSQL Database (Keycloak)
  # ----------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres-dev
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - keycloak-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Keycloak (Identity & Access Management)
  # ----------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-dev
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      
      # Admin Credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      
      # Development Settings
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    command:
      - start-dev
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - keycloak-network
      - frontend-network
      - backend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Backend API (FastAPI) - Development with Hot Reload
  # ----------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    environment:
      # Database
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-backend_dev}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-12345}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      
      # Password of the worker's database role (appstore_worker); set by
      # `make migrate-dev` (scripts/worker_db_role.py after alembic).
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-worker}

      # Git
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      
      # Keycloak
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dhbw}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-appstore-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}

      # LTI 1.3 (Moodle) — see app/utils/lti_auth.py. LTI_PLATFORM_JWKS_HOST_HEADER
      # is needed in dev because the backend container reaches Moodle via
      # host.docker.internal, which doesn't match the vhost Moodle's
      # wwwroot/iss actually matches on (localhost:8000).
      LTI_PLATFORM_ISSUER: ${LTI_PLATFORM_ISSUER:-}
      LTI_PLATFORM_JWKS_URL: ${LTI_PLATFORM_JWKS_URL:-}
      LTI_PLATFORM_JWKS_HOST_HEADER: ${LTI_PLATFORM_JWKS_HOST_HEADER:-}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-}
      LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID:-}
      LTI_SESSION_SECRET: ${LTI_SESSION_SECRET:-}

      # Public URL of this API, used to build the LTI redirect_uri sent
      # to Moodle. In dev the backend is reachable directly on
      # localhost:8000 (no /api-stripping proxy in front of it like
      # staging/prod), matching the Settings default.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}

      # CORS
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]}'

      # Email (Gmail SMTP) — used by the post-deploy notify hook in
      # services/task_finalizer.py (sent once per deploy). SMTP_ENABLED is the explicit
      # kill-switch (default false): even with SMTP_USER/SMTP_PASSWORD
      # populated, mail delivery only happens when SMTP_ENABLED=true.
      # Use it to keep credentials in .env for later but turn delivery
      # off in dev / CI / on demo days without scrubbing the creds.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Click-n-Deploy}

      # Public base URL of the frontend, used in owner-summary mails
      # to deep-link back to the deployment detail page.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}

      # Application
      DEBUG: "True"
      APP_NAME: ${APP_NAME:-Backend API Dev}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - ../backend:/app
      - /app/.venv
      - backend_git_repos:/tmp/repos
      # Mount shared SSH key for Git operations
      - ssh_keys:/root/.ssh:ro
    networks:
      - frontend-network
      - backend-network
      # The worker reaches /internal/tfstate (OpenTofu's state backend)
      # over this network.
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Worker Service (Postgres job queue) - Development
  # ----------------------------------------------------------------
  # Claims jobs from the `tasks` table as the restricted
  # `appstore_worker` role (LISTEN task_queued + SKIP LOCKED); OpenTofu
  # keeps the state in the backend via /internal/tfstate.
  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile.dev
    container_name: worker-dev
    # Use host network to allow OpenStack API access
    # Note: This disables container network isolation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # Job queue: the application DB, as the restricted worker role
      # (password set by `make migrate-dev`).
      DATABASE_URL: postgresql://appstore_worker:${WORKER_DB_PASSWORD:-worker}@postgres:5432/${DB_NAME:-backend_dev}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

      # OpenTofu state backend (/internal/tfstate) on the backend.
      APPSTORE_API_URL: http://backend:8000

      # Job payload / OpenStack credential decryption (must match backend)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}

      # Git
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}

      # Application
      DEBUG: "True"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      # Mount source code for hot reload
      - ../worker:/app
      - /app/.venv
      - worker_git_repos:/tmp/worker_repos
      # States OpenTofu could not save (API unreachable for minutes),
      # kept encrypted until `make prod-restore-tfstate` puts them back.
      - worker_rescued_state:/var/lib/appstore-worker/rescued-state
      # Mount shared SSH key for Git operations
      - ssh_keys:/root/.ssh:ro
    networks:
      - worker-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Frontend (React/Next.js) - Development with Hot Reload
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    environment:
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      # Mount source code for hot reload
      - ../frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
      - /app/.next         # Prevent overwriting .next build folder
    networks:
      - frontend-network
    restart: unless-stopped

  # ----------------------------------------------------------------
  # pgAdmin (Database Management UI) - Development Only
  # ----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - backend-network
      - worker-network
    restart: unless-stopped

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local
  keycloak_postgres_data:
    driver: local
  backend_git_repos:
    driver: local
  worker_git_repos:
    driver: local
  worker_rescued_state:
    driver: local
  ssh_keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSH_KEY_PATH:-$HOME/.ssh}

# ----------------------------------------------------------------
# Networks
# ----------------------------------------------------------------
networks:
  frontend-network:
    driver: bridge
    name: frontend-network-dev
  backend-network:
    driver: bridge
    name: backend-network-dev
  worker-network:
    driver: bridge
    name: worker-network-dev
  keycloak-network:
    driver: bridge
    name: keycloak-network-dev
