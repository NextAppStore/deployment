# Worker (Postgres-native job queue — Celery/RabbitMQ/Redis removed by
# the techstack-simplification). Mirrors the `worker` service in
# docker-compose.staging.yml.
#
# Claims jobs from the `tasks` table (LISTEN task_queued + SKIP LOCKED)
# as the restricted `appstore_worker` role, which the migration grants
# exactly the queue columns — no app data, no credentials. OpenTofu
# reaches its state through the backend's /internal/tfstate endpoint
# with a per-task token (blocked from public ingress — see ingress.yaml),
# not a direct DB connection, so the worker no longer needs its own
# postgres-tfstate service or isolated network segment for that purpose.
# sync-wave "3": must start strictly after migration-job.yaml's two
# Jobs (waves 1-2) — specifically after appstore-worker-db-role (wave 2)
# sets the appstore_worker role's password, or this Deployment's
# DATABASE_URL connection fails auth on every boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "appstore.selectorLabels" "worker" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "appstore.selectorLabels" "worker" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appstore.selectorLabels" "worker" | nindent 8 }}
    spec:
      # On SIGTERM the worker claims nothing new and lets running jobs
      # finish (an apply or Packer build can take many minutes) — mirrors
      # compose's `stop_grace_period: 30m`. A job killed anyway is failed
      # by the backend once its lease runs out; nothing is retried
      # automatically.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "appstore.image" (dict "registry" $.Values.global.imageRegistry "repository" .Values.worker.image.repository "tag" .Values.worker.image.tag) }}
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_NAME } }
            - name: WORKER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: WORKER_DB_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql://appstore_worker:$(WORKER_DB_PASSWORD)@postgres:5432/$(DB_NAME)"
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: APPSTORE_API_URL
              value: "http://backend:{{ .Values.backend.port }}"
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: CREDENTIAL_ENCRYPTION_KEY } }
            - name: GIT_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: GIT_ACCESS_TOKEN } }
            - name: DEBUG
              value: {{ .Values.worker.env.debug | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.worker.env.logLevel | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: git-repos
              mountPath: /tmp/repos
            - name: rescued-state
              mountPath: /var/lib/appstore-worker/rescued-state
      volumes:
        - name: git-repos
          emptyDir: {}
        # worker_rescued_state in compose is a named (persistent-across-
        # restart) volume — states OpenTofu couldn't save (API
        # unreachable for minutes) are kept here encrypted until
        # `make prod-restore-tfstate` puts them back. A Deployment can't
        # declare a volumeClaimTemplate the way a StatefulSet can, so
        # this references a standalone PVC (below) instead. Only safe
        # with worker.replicas: 1 — a ReadWriteOnce PVC shared by more
        # than one pod would not give each worker its own rescue area.
        - name: rescued-state
          persistentVolumeClaim:
            claimName: worker-rescued-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-rescued-state
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.worker.rescuedState.storage }}
