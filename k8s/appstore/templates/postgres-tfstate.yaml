# Worker-only Postgres for Terraform's `pg` state backend. Deliberately
# isolated from the application database — see networkpolicy.yaml, which
# denies this Service any traffic except from the worker pod. Mirrors the
# `postgres-tfstate` service in docker-compose.staging.yml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-tfstate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "appstore.selectorLabels" "postgres-tfstate" | nindent 4 }}
spec:
  serviceName: postgres-tfstate
  replicas: 1
  selector:
    matchLabels:
      {{- include "appstore.selectorLabels" "postgres-tfstate" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appstore.selectorLabels" "postgres-tfstate" | nindent 8 }}
    spec:
      containers:
        - name: postgres-tfstate
          image: {{ .Values.postgresTfstate.image }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: appstore-core-secrets, key: TFSTATE_DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: appstore-core-secrets, key: TFSTATE_DB_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: appstore-core-secrets, key: TFSTATE_DB_NAME }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresTfstate.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresTfstate.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-tfstate
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    {{- include "appstore.selectorLabels" "postgres-tfstate" | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
