# Replicates the bridge-network isolation boundaries from
# docker-compose.staging.yml's `networks:` section (post techstack-
# simplification: RabbitMQ/Redis/postgres-tfstate are gone):
#   - frontend-network: ingress, frontend, backend
#   - backend-network:  backend, postgres, keycloak, ingress
#   - worker-network:   worker, backend (for /internal/tfstate), postgres
#     (as the restricted appstore_worker role — see worker.yaml)
#   - keycloak-network: keycloak, keycloak-postgres, ingress
#
# Default-deny ingress within the namespace, then explicit allows per
# component. (lti-egress-network's IPv6/NAT66 split has no Kubernetes
# equivalent here — egress to Moodle is unrestricted; add an egress
# NetworkPolicy + CNI-specific IPv6 support if that isolation is required.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels: {{ include "appstore.selectorLabels" "frontend" | fromYaml | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-backend
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels: {{ include "appstore.selectorLabels" "backend" | fromYaml | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-keycloak
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels: {{ include "appstore.selectorLabels" "keycloak" | fromYaml | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels: {{ include "appstore.selectorLabels" "postgres" | fromYaml | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    # backend (application DB role) and worker (appstore_worker role,
    # restricted by DB grants to the job queue columns — see
    # worker_db_role.py / the migration that creates the role) both
    # connect directly now that there is no separate postgres-tfstate.
    - from:
        - podSelector:
            matchLabels: {{ include "appstore.selectorLabels" "backend" | fromYaml | toJson }}
        - podSelector:
            matchLabels: {{ include "appstore.selectorLabels" "worker" | fromYaml | toJson }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-keycloak-postgres
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels: {{ include "appstore.selectorLabels" "keycloak-postgres" | fromYaml | toJson }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "appstore.selectorLabels" "keycloak" | fromYaml | toJson }}
