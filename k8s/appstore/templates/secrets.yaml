{{- if .Values.externalSecrets.enabled }}
# ExternalSecret resources (External Secrets Operator CRDs) — each one
# pulls real values from the SecretStore named in externalSecrets.secretStoreRef
# and materializes them as a native Kubernetes Secret. No plaintext secret
# value is ever committed to this repo; only key *references* are.
#
# The remoteRef.key names below are suggestions — point them at wherever
# these keys actually live in your secret backend, and keep them in sync
# with the required vars in docker-compose.staging.yml's `:?required` list.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appstore-core-secrets
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: appstore-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef: { key: appstore/db, property: user }
    - secretKey: DB_PASSWORD
      remoteRef: { key: appstore/db, property: password }
    - secretKey: DB_NAME
      remoteRef: { key: appstore/db, property: name }
    - secretKey: TFSTATE_DB_USER
      remoteRef: { key: appstore/tfstate-db, property: user }
    - secretKey: TFSTATE_DB_PASSWORD
      remoteRef: { key: appstore/tfstate-db, property: password }
    - secretKey: TFSTATE_DB_NAME
      remoteRef: { key: appstore/tfstate-db, property: name }
    - secretKey: KEYCLOAK_DB_USER
      remoteRef: { key: appstore/keycloak-db, property: user }
    - secretKey: KEYCLOAK_DB_PASSWORD
      remoteRef: { key: appstore/keycloak-db, property: password }
    - secretKey: KEYCLOAK_DB_NAME
      remoteRef: { key: appstore/keycloak-db, property: name }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: appstore/keycloak, property: admin-password }
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef: { key: appstore/keycloak, property: backend-client-secret }
    - secretKey: RABBITMQ_USER
      remoteRef: { key: appstore/rabbitmq, property: user }
    - secretKey: RABBITMQ_PASSWORD
      remoteRef: { key: appstore/rabbitmq, property: password }
    - secretKey: SECRET_KEY
      remoteRef: { key: appstore/backend, property: secret-key }
    - secretKey: CREDENTIAL_ENCRYPTION_KEY
      remoteRef: { key: appstore/backend, property: credential-encryption-key }
    - secretKey: GIT_ACCESS_TOKEN
      remoteRef: { key: appstore/backend, property: git-access-token }
    - secretKey: LTI_SESSION_SECRET
      remoteRef: { key: appstore/backend, property: lti-session-secret }
    - secretKey: SMTP_USER
      remoteRef: { key: appstore/smtp, property: user }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: appstore/smtp, property: password }
    - secretKey: SMTP_FROM_EMAIL
      remoteRef: { key: appstore/smtp, property: from-email }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appstore-frontend-secrets
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: appstore-frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: VITE_KEYCLOAK_CLIENT_SECRET
      remoteRef: { key: appstore/keycloak, property: frontend-client-secret }
{{- end }}
