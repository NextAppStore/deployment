# No Secret resources are templated here on purpose — this chart does
# NOT manage appstore-core-secrets / appstore-frontend-secrets. They are
# created ONCE by hand, directly against the cluster via kubectl (the
# direct Kubernetes analog of a GitHub Actions secret: centrally stored,
# referenced by name from the Deployments below, never committed to Git).
#
# This chart previously used External Secrets Operator ExternalSecret
# resources to generate these Secrets from a remote secret backend (e.g.
# Vault) — reverted because the cluster has neither ESO installed nor a
# backend to point it at, and standing both up was out of scope for
# getting staging running. If/when a real secret backend exists, restore
# that approach (see git history on this file) instead of hand-run kubectl.
#
# Run once per cluster/namespace, replacing every <value> below with the
# real secret (never commit the filled-in command anywhere):
#
#   kubectl create secret generic appstore-core-secrets \
#     --namespace={{ .Values.global.namespace }} \
#     --from-literal=DB_USER=<value> \
#     --from-literal=DB_PASSWORD=<value> \
#     --from-literal=DB_NAME=<value> \
#     --from-literal=WORKER_DB_PASSWORD=<value> \
#     --from-literal=KEYCLOAK_DB_USER=<value> \
#     --from-literal=KEYCLOAK_DB_PASSWORD=<value> \
#     --from-literal=KEYCLOAK_DB_NAME=<value> \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD=<value> \
#     --from-literal=KEYCLOAK_CLIENT_SECRET=<value> \
#     --from-literal=SECRET_KEY=<value> \
#     --from-literal=CREDENTIAL_ENCRYPTION_KEY=<value> \
#     --from-literal=GIT_ACCESS_TOKEN=<value> \
#     --from-literal=LTI_SESSION_SECRET=<value> \
#     --from-literal=SMTP_USER=<value> \
#     --from-literal=SMTP_PASSWORD=<value> \
#     --from-literal=SMTP_FROM_EMAIL=<value>
#
#   kubectl create secret generic appstore-frontend-secrets \
#     --namespace={{ .Values.global.namespace }} \
#     --from-literal=VITE_KEYCLOAK_CLIENT_SECRET=<value>
#
# To update a value later: kubectl delete secret <name> -n <namespace>,
# then re-run the create command above with the new value (`create`
# doesn't update in place; `kubectl apply` with a Secret manifest works
# too if you prefer not to delete first, but then the manifest itself
# holds the plaintext value on whatever machine you run it from — treat
# that file the same as you would a filled-in .env, and don't commit it).
