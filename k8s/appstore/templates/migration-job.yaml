# Runs `python -m alembic upgrade head` as an ArgoCD PostSync hook — kept
# as its own Job (not a backend initContainer) for the same reason the
# Ansible playbook runs it as a dedicated step rather than inside compose:
# migration failures must surface directly in the hook's own log/status,
# not be buried inside a container-start retry loop. hook-delete-policy
# removes the completed Job so re-syncs don't collide with a stale name.
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: appstore-migrate
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "appstore.image" (dict "registry" $.Values.global.imageRegistry "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            # $(VAR) only resolves a var declared EARLIER in this list.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_NAME } }
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
---
# The migration above creates the worker's database role (appstore_worker)
# with its column grants but no password; this Job sets that password from
# WORKER_DB_PASSWORD, mirroring the dedicated Ansible step that runs
# `docker exec backend-prod python scripts/worker_db_role.py` right after
# `alembic upgrade head`. sync-wave "1" (after the default-wave migration
# Job above) guarantees the role exists before this runs; the worker
# Deployment itself just retries its DB connection until this has landed.
apiVersion: batch/v1
kind: Job
metadata:
  name: appstore-worker-db-role
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker-db-role
          image: {{ include "appstore.image" (dict "registry" $.Values.global.imageRegistry "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
          command: ["python", "scripts/worker_db_role.py"]
          env:
            # $(VAR) only resolves a var declared EARLIER in this list.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: DB_NAME } }
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"
            - name: WORKER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: appstore-core-secrets, key: WORKER_DB_PASSWORD } }
{{- end }}
