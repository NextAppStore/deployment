# Staging overrides. Applied on top of values.yaml.
#
# backend.image.tag is bumped by deployment/.github/workflows/k8s-deploy.yml
# after each backend build — it edits that one field via `yq` and commits,
# which is what triggers ArgoCD's sync. Do not hand-edit it on the staging
# branch outside that workflow unless deliberately pinning a rollback.
#
# worker.image.tag / frontend.image.tag stay on `latest` deliberately —
# worker/ci.yml and frontend/ci.yml already keep `latest` current on
# every push to their own main (same images docker-compose.staging.yml's
# ${WORKER_VERSION:-latest}/${FRONTEND_VERSION:-latest} defaults pull).
# k8s-deploy.yml only rebuilds backend (to bake in deployment/seed/ — see
# that workflow's header comment), so it only ever bumps backend's tag.

global:
  namespace: appstore

ingress:
  host: appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site # TODO: replace with real staging hostname

backend:
  image:
    tag: latest
  env:
    corsOrigins: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site"
    appBaseUrl: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site"
    apiBaseUrl: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site/api"

worker:
  image:
    tag: latest

frontend:
  image:
    tag: latest
  env:
    appUrl: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site"
    apiUrl: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site/api"
    keycloakUrl: "https://appstore.s242808-at-student-dhbw-mannheim-de.users.dhbw.site"
