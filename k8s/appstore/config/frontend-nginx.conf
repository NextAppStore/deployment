# SPA nginx config served to the frontend pod via ConfigMap (see
# templates/frontend.yaml). Kept byte-identical in intent to
# frontend/nginx.conf in the frontend repo — that copy is what gets baked
# into the image and is what docker-compose.staging.yml uses. This copy is
# what Kubernetes mounts, so the cluster does not have to wait for a
# frontend image rebuild to pick up a config change.
#
# If you change one, change the other. The duplication is deliberate:
# Helm's .Files.Get cannot read outside the chart directory, and the
# frontend lives in a separate repository.
#
# Lives in config/ rather than files/ on purpose: .gitignore excludes
# k8s/appstore/files/ because the k8s-deploy.yml workflow generates the
# Keycloak realm export into it at build time. A chart input committed
# there would be silently dropped from git, and ArgoCD would then render
# this ConfigMap empty.
server {
  # The staging k3s cluster is IPv6-primary (pod CIDR fd00:42::/64), so the
  # kubelet probes http://[fd00:42::x]:8080/. A plain `listen 8080;` binds
  # 0.0.0.0 only, which refuses those connections and makes the liveness
  # probe restart a perfectly healthy nginx.
  #
  # ONE listen directive only: `ipv6only=off` makes this single socket
  # accept both IPv6 and IPv4 (v4-mapped), so IPv4 clients — docker-compose
  # and the image HEALTHCHECK against 127.0.0.1 — keep working. Adding a
  # separate `listen 8080;` alongside this is NOT a belt-and-braces
  # improvement: both directives would try to claim 0.0.0.0:8080 and nginx
  # dies with `bind() to [::]:8080 failed (98: Address in use)`. Note that
  # `nginx -t` passes on that broken config — it only fails on a real bind.
  listen [::]:8080 ipv6only=off;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
