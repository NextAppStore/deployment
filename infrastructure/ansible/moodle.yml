---
- name: 2. CONFIGURE Docker and Deploy Moodle (DevMoodle) on a fresh VM
  hosts: docker_vm
  become: yes
  gather_facts: yes

  vars:
    docker_users: ["ubuntu"]
    docker_install_compose: true
    project_root: "/home/ubuntu/moodle"
    moodle_web_port: 8000
    moodle_repo: "https://github.com/NextAppStore/DevMoodle"
    moodle_repo_version: "main"
    # Pinned to match the commit DevMoodle/start.sh clones — must stay in
    # sync with that script and with moodle-data/seed.sql.gz, which was
    # exported against this exact Moodle checkout.
    moodle_src_commit: "8eae8fc94d0e3932cbc64f1e81414903a1e2e83b"

  pre_tasks:
    - name: Verzeichnis für Moodle erstellen
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

  roles:
    - role: geerlingguy.docker
      tags: [docker_install]

  tasks:
    - name: nginx, git und curl installieren
      ansible.builtin.apt:
        name: [nginx, git, curl]
        state: present
        update_cache: yes

    - name: .env aus MOODLE_ENV_FILE auf VM schreiben
      ansible.builtin.copy:
        content: "{{ lookup('env', 'MOODLE_ENV_FILE') }}"
        dest: "{{ project_root }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: DevMoodle-Repository klonen
      ansible.builtin.git:
        repo: "{{ moodle_repo }}"
        dest: "{{ project_root }}/DevMoodle"
        version: "{{ moodle_repo_version }}"
        force: yes

    # Ansible's git module can be unreliable recursing submodules across
    # versions, so init them explicitly — mirrors start.sh step 2.
    - name: Git-Submodule (moodle-docker) initialisieren
      ansible.builtin.command: git submodule update --init --recursive
      args:
        chdir: "{{ project_root }}/DevMoodle"
      changed_when: true

    # ----------------------------------------------------------------
    # TLS certificate provisioning — done before Moodle containers start
    # and before nginx is (re)configured, since nginx needs certs in
    # place to bind to 443. Same two-path pattern as staging.yml:
    #   - TLS_DOMAIN set   -> real cert for moodle.<TLS_DOMAIN> via
    #                         DHBW's ACME server (DNS-01 / acme.sh).
    #   - TLS_DOMAIN empty -> self-signed fallback.
    # ----------------------------------------------------------------
    - name: TLS_DOMAIN aus .env lesen
      ansible.builtin.shell:
        cmd: |
          grep -E '^TLS_DOMAIN=' "{{ project_root }}/.env" \
            | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
        executable: /bin/bash
      register: tls_domain_raw
      changed_when: false

    - name: moodle_domain setzen
      ansible.builtin.set_fact:
        moodle_domain: "{{ ('moodle.' + (tls_domain_raw.stdout | trim)) if (tls_domain_raw.stdout | trim != '') else inventory_hostname }}"

    - name: TLS_DOMAIN-abhängige DNS/AAAA-Einrichtung
      when: tls_domain_raw.stdout | trim != ''
      block:
        # DNS_TSIG_KEY is the literal BIND ``key "..." { ...; };`` clause,
        # shell-quoted in .env — source the line through bash to let it do
        # the unquoting rather than a plain grep/cut.
        - name: DNS_TSIG_KEY aus .env lesen
          ansible.builtin.shell:
            cmd: |
              set -e
              line=$(grep -E '^DNS_TSIG_KEY=' "{{ project_root }}/.env" | head -n1 | tr -d '\r')
              eval "$line"
              printf '%s' "$DNS_TSIG_KEY"
            executable: /bin/bash
          register: dns_tsig_key_raw
          changed_when: false

        - name: TLS-Variablen setzen
          ansible.builtin.set_fact:
            tls_domain: "{{ tls_domain_raw.stdout | trim }}"
            dns_tsig_key: "{{ dns_tsig_key_raw.stdout | trim }}"

        - name: TSIG-Key-Verzeichnis anlegen
          ansible.builtin.file:
            path: /etc/acme-dns
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: tsig.key schreiben
          ansible.builtin.copy:
            content: "{{ dns_tsig_key }}\n"
            dest: /etc/acme-dns/tsig.key
            owner: root
            group: root
            mode: '0600'

        # Keeps moodle.<TLS_DOMAIN>'s AAAA record pointed at this VM's
        # live IP on every deploy — OpenStack allocates a new IPv6 on VM
        # recreation, so the record would otherwise silently go stale.
        - name: AAAA-Record für moodle.<TLS_DOMAIN> aktualisieren
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              nsupdate -k /etc/acme-dns/tsig.key <<EOF
              server ns.cloud-ns.dhbw-mannheim.de. 53
              zone {{ tls_domain }}
              update delete moodle.{{ tls_domain }}. IN AAAA
              update add moodle.{{ tls_domain }}. 60 IN AAAA {{ inventory_hostname }}
              send
              EOF
            executable: /bin/bash
          changed_when: true

    - name: Verzeichnis für nginx-Zertifikate anlegen
      ansible.builtin.file:
        path: /etc/nginx/certs/moodle
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Self-signed TLS-Zertifikat generieren (falls nicht vorhanden)
      ansible.builtin.shell:
        cmd: |
          set -e
          if [ ! -f /etc/nginx/certs/moodle/cert.pem ]; then
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout /etc/nginx/certs/moodle/key.pem \
              -out    /etc/nginx/certs/moodle/cert.pem \
              -subj "/CN={{ inventory_hostname }}" \
              -addext "subjectAltName=IP:{{ inventory_hostname }}"
            chmod 600 /etc/nginx/certs/moodle/key.pem
            echo "cert generated"
          else
            echo "cert exists, skipped"
          fi
        executable: /bin/bash
      register: cert_result
      changed_when: "'cert generated' in cert_result.stdout"
      when: tls_domain_raw.stdout | trim == ''

    - name: ACME-TLS-Zertifikat via acme.sh besorgen (DNS-01, DHBW ACME-Server)
      when: tls_domain_raw.stdout | trim != ''
      block:
        - name: ACME_ACCOUNT_EMAIL aus .env lesen
          ansible.builtin.shell:
            cmd: |
              grep -E '^ACME_ACCOUNT_EMAIL=' "{{ project_root }}/.env" \
                | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
            executable: /bin/bash
          register: acme_email_raw
          changed_when: false

        - name: ACME-Variablen setzen
          ansible.builtin.set_fact:
            acme_account_email: "{{ acme_email_raw.stdout | trim }}"

        - name: acme.sh installiert? prüfen
          ansible.builtin.stat:
            path: /root/.acme.sh/acme.sh
          register: acme_sh_bin

        - name: acme.sh installieren (idempotent)
          ansible.builtin.shell:
            cmd: |
              set -e
              curl -fsSL https://get.acme.sh | sh -s email={{ acme_account_email }}
            executable: /bin/bash
          when: not acme_sh_bin.stat.exists

        - name: ACME-Account beim DHBW-Server registrieren (idempotent)
          ansible.builtin.shell:
            cmd: |
              /root/.acme.sh/acme.sh --register-account \
                --server https://certificates.dhbw.cloud \
                -m {{ acme_account_email }}
            executable: /bin/bash
          register: acme_register
          changed_when: "'Registering account' in acme_register.stdout"
          failed_when: acme_register.rc != 0 and 'already registered' not in acme_register.stdout

        # acme.sh tracks issuance/renewal state itself, so call --issue
        # unconditionally every run rather than reimplementing that check
        # via file existence. Exit code 2 means "Skipping, cert not due
        # for renewal yet" — the expected steady-state outcome.
        - name: Zertifikat ausstellen / erneuern (acme.sh entscheidet selbst ob nötig)
          ansible.builtin.shell:
            cmd: |
              export NSUPDATE_SERVER="ns.cloud-ns.dhbw-mannheim.de."
              export NSUPDATE_SERVER_PORT="53"
              export NSUPDATE_KEY="/etc/acme-dns/tsig.key"
              /root/.acme.sh/acme.sh --issue \
                --server https://certificates.dhbw.cloud \
                --dns dns_nsupdate \
                -d moodle.{{ tls_domain }}
            executable: /bin/bash
          register: acme_issue
          changed_when: "'Cert success' in acme_issue.stdout"
          failed_when: acme_issue.rc not in [0, 2]

        - name: Zertifikat nach /etc/nginx/certs/moodle installieren (inkl. Reload-Hook)
          ansible.builtin.shell:
            cmd: |
              /root/.acme.sh/acme.sh --install-cert -d moodle.{{ tls_domain }} \
                --key-file       /etc/nginx/certs/moodle/key.pem \
                --fullchain-file /etc/nginx/certs/moodle/cert.pem \
                --reloadcmd      "systemctl reload nginx"
            executable: /bin/bash
          register: acme_install
          changed_when: true

        - name: Berechtigungen auf installiertes Zertifikat setzen
          ansible.builtin.file:
            path: "{{ item.path }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - { path: "/etc/nginx/certs/moodle/key.pem", mode: '0600' }
            - { path: "/etc/nginx/certs/moodle/cert.pem", mode: '0644' }

    - name: nginx-vhost für Moodle rendern
      ansible.builtin.template:
        src: templates/moodle-nginx.conf.j2
        dest: /etc/nginx/sites-available/moodle.conf
        owner: root
        group: root
        mode: '0644'

    - name: nginx-vhost aktivieren
      ansible.builtin.file:
        src: /etc/nginx/sites-available/moodle.conf
        dest: /etc/nginx/sites-enabled/moodle.conf
        state: link

    - name: Standard-nginx-Site deaktivieren
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: nginx-Konfiguration prüfen
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: nginx neu starten
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: yes

    # Moodle-Quellcode auf gepinnten Commit klonen (start.sh Schritt 3) —
    # passt exakt zum Stand von moodle-data/seed.sql.gz.
    - name: Prüfen ob Moodle-Quellcode bereits vorhanden ist
      ansible.builtin.stat:
        path: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
      register: moodle_config_php

    - name: Moodle-Quellcode klonen (gepinnt)
      when: not moodle_config_php.stat.exists
      block:
        - name: moodle-src Git-Repo initialisieren
          ansible.builtin.command: git init -q "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
          changed_when: true

        - name: Moodle-Upstream-Remote setzen
          ansible.builtin.command: git remote add origin https://github.com/moodle/moodle.git
          args:
            chdir: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
          changed_when: true

        - name: Gepinnten Moodle-Commit fetchen
          ansible.builtin.command: git fetch --depth 1 origin {{ moodle_src_commit }}
          args:
            chdir: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
          changed_when: true

        - name: Gepinnten Moodle-Commit auschecken
          ansible.builtin.command: git checkout -q FETCH_HEAD
          args:
            chdir: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
          changed_when: true

        - name: config.php aus Template erstellen
          ansible.builtin.copy:
            src: "{{ project_root }}/DevMoodle/moodle-docker/config.docker-template.php"
            dest: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
            remote_src: yes

    # config.docker-template.php ist ein reines Lokal-Dev-Template: es baut
    # $CFG->wwwroot immer als "http://<MOODLE_DOCKER_WEB_HOST>:<MOODLE_DOCKER_WEB_PORT>"
    # (siehe "Docker deployment"-Zweig des Templates) und kennt kein "hinter
    # TLS-terminierendem Reverse-Proxy auf Standard-Port" Szenario. Ohne diesen
    # Patch verweist jeder Moodle-Redirect auf http://moodle.<domain>:8000/ —
    # von aussen unerreichbar (nur 80/443 sind offen), was wie ein endloses
    # Laden/Timeout aussieht. Läuft unconditional (nicht nur bei Neuerstellung),
    # damit auch ein schon bestehendes config.php korrigiert wird.
    #
    # Ersetzt gezielt nur die "Docker deployment"-Zweig-Zeile (mit führendem
    # Whitespace, da das Template mit 4 Leerzeichen einrückt) sowie die separate
    # ".= \":{$port}\"" Port-Anhänge-Zeile, damit der Gitpod-Zweig unangetastet
    # bleibt.
    - name: wwwroot (Docker-Zweig) in config.php auf öffentliche HTTPS-Domain korrigieren
      ansible.builtin.replace:
        path: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
        regexp: "^\\s*\\$CFG->wwwroot\\s*=\\s*\"http://\\{\\$host\\}\";$"
        replace: "    $CFG->wwwroot   = 'https://{{ moodle_domain }}';"

    - name: Port-Anhänge-Zeile an wwwroot entfernen
      ansible.builtin.replace:
        path: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
        regexp: "^\\s*\\$CFG->wwwroot\\s*\\.=\\s*\":\\{\\$port\\}\";$"
        replace: "    // wwwroot port suffix removed by Ansible (public HTTPS domain has no port)"

    # ansible.builtin.lineinfile wurde hier bewusst NICHT verwendet: dessen
    # `regexp` sucht über die GESAMTE Datei, nicht nur nahe `insertafter` —
    # das Template hat im Gitpod-Zweig bereits eine (andere) "$CFG->sslproxy
    # = true;"-Zeile, die fälschlich als "schon vorhanden" erkannt wurde und
    # die Einfügung im Docker-Zweig stillschweigend verhindert hat (beobachtet:
    # sslproxy fehlte im deployten config.php trotz "ok"-Status). `replace`
    # auf den eindeutigen "// Docker deployment."-Anker vermeidet das.
    - name: sslproxy in config.php setzen (TLS wird von nginx terminiert)
      ansible.builtin.replace:
        path: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
        regexp: "^(\\s*)// Docker deployment\\.\\n(?!\\s*\\$CFG->sslproxy\\s*=)"
        replace: "\\1// Docker deployment.\\n\\1$CFG->sslproxy = true;\\n"

    # Startet die Moodle-Container (start.sh Schritt 5). MOODLE_DOCKER_WEB_HOST
    # wird auf die echte Domain gesetzt statt auf "localhost" (start.sh-Default),
    # damit Moodles eigene Site-Konfiguration zur öffentlichen Domain passt.
    #
    # base.yml definiert immer auch "exttests" und "selenium" (Behat/Testing-
    # Images), unabhängig von MOODLE_DOCKER_BROWSER — start.sh nutzt diese nie,
    # sie kosten hier nur zusätzliche (teils grosse, ratelimit-anfällige) Pulls.
    # Explizite Service-Liste startet nur, was tatsächlich gebraucht wird.
    - name: Moodle-Docker-Container starten
      ansible.builtin.command: bin/moodle-docker-compose up -d webserver db mailpit
      args:
        chdir: "{{ project_root }}/DevMoodle/moodle-docker"
      environment:
        MOODLE_DOCKER_WWWROOT: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
        MOODLE_DOCKER_DB: pgsql
        MOODLE_DOCKER_WEB_PORT: "{{ moodle_web_port }}"
        MOODLE_DOCKER_WEB_HOST: "{{ moodle_domain }}"
      changed_when: true

    - name: Auf Datenbank warten
      ansible.builtin.command: bin/moodle-docker-wait-for-db
      args:
        chdir: "{{ project_root }}/DevMoodle/moodle-docker"
      environment:
        MOODLE_DOCKER_WWWROOT: "{{ project_root }}/DevMoodle/moodle-docker/moodle-src"
        MOODLE_DOCKER_DB: pgsql
        MOODLE_DOCKER_WEB_PORT: "{{ moodle_web_port }}"
        MOODLE_DOCKER_WEB_HOST: "{{ moodle_domain }}"
      changed_when: false

    # Seed-Import (start.sh Schritt 6). docker-compose v2 Namensschema:
    # Bindestriche statt Unterstriche.
    - name: Prüfen ob Moodle-Datenbank bereits initialisiert ist
      ansible.builtin.shell:
        cmd: |
          timeout 20 docker exec moodle-docker-db-1 psql -U moodle -d moodle -t \
            -c "SELECT to_regclass('public.m_course');" 2>/dev/null | tr -d '[:space:]'
        executable: /bin/bash
      register: moodle_db_initialized
      changed_when: false

    - name: Vorkonfigurierte Moodle-Daten einspielen (seed.sql.gz)
      when: moodle_db_initialized.stdout == '' or moodle_db_initialized.stdout == 'NULL'
      block:
        - name: seed.sql.gz in Datenbank einspielen
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              gunzip -c "{{ project_root }}/DevMoodle/moodle-data/seed.sql.gz" \
                | docker exec -i moodle-docker-db-1 psql -U moodle -d moodle >/dev/null
            executable: /bin/bash
          changed_when: true

    # LTI-Tool (Seed-Daten aus start.sh-Workflow) zeigt standardmäßig auf eine
    # lokale ngrok-Tunnel-URL von DevMoodles LTI-Mock-Server (dev-only, längst
    # abgelaufen). Zeigt stattdessen auf die App-Store-Staging-Instanz, deren
    # LTI-Endpunkte unter /api/lti/launch bzw. /api/lti/login liegen (nginx
    # strippt /api/, Backend-Router ist unter /lti gemounted — siehe
    # backend/app/main.py: app.include_router(auth_lti.router, prefix="/lti")).
    # Selbe Update-Logik wie DevMoodle/set-lti-url.sh, nur unconditional bei
    # jedem Deploy statt manuell. Nur wenn TLS_DOMAIN gesetzt ist (sonst gibt
    # es keine erreichbare App-Store-Domain, auf die verwiesen werden könnte).
    - name: App-Store-URL für LTI-Tool ermitteln
      ansible.builtin.set_fact:
        appstore_lti_base_url: "https://appstore.{{ tls_domain_raw.stdout | trim }}"
      when: tls_domain_raw.stdout | trim != ''

    - name: LTI-Tool auf App-Store-Instanz umstellen
      when: tls_domain_raw.stdout | trim != ''
      ansible.builtin.shell:
        cmd: |
          timeout 20 docker exec -i moodle-docker-db-1 psql -U moodle -d moodle >/dev/null <<'EOSQL'
          UPDATE m_lti_types
          SET baseurl = '{{ appstore_lti_base_url }}/api/lti/launch', tooldomain = 'appstore.{{ tls_domain_raw.stdout | trim }}'
          WHERE id = 1;

          UPDATE m_lti_types_config
          SET value = '{{ appstore_lti_base_url }}/api/lti/launch'
          WHERE typeid = 1 AND name = 'publickeyset';

          UPDATE m_lti_types_config
          SET value = '{{ appstore_lti_base_url }}/api/lti/login'
          WHERE typeid = 1 AND name = 'initiatelogin';

          UPDATE m_lti_types_config
          SET value = '{{ appstore_lti_base_url }}/api/lti/launch'
          WHERE typeid = 1 AND name = 'redirectionuris';
          EOSQL
        executable: /bin/bash
      changed_when: true

    # Unconditional (nicht nur beim Seed-Import): config.php wird bei jedem
    # Lauf durch die wwwroot/sslproxy-Tasks oben gepatcht, und Moodle cached
    # Config/Redirect-Verhalten — ohne Purge nach einer config.php-Änderung
    # kann ein zuvor falsches wwwroot (z.B. mit :8000-Suffix) zu einer
    # Redirect-Schleife führen, obwohl config.php inzwischen korrekt ist.
    # Läuft auch nach der LTI-URL-Aktualisierung, damit gecachte LTI-
    # Konfiguration nicht die neuen Werte verdeckt.
    #
    # `timeout 60` als harte Wanduhr-Grenze: PHP kann bei einem defekten
    # wwwroot/Session-Zustand hier unbegrenzt hängen bleiben (beobachtet:
    # >15 Minuten ohne Ende) und damit den self-hosted Runner blockieren.
    - name: Moodle-Caches leeren
      ansible.builtin.command: timeout 60 docker exec moodle-docker-webserver-1 php admin/cli/purge_caches.php
      changed_when: true
      failed_when: false

    - name: Status der Moodle-Container anzeigen
      ansible.builtin.command: docker ps --filter "name=moodle-docker"
      register: moodle_ps
      changed_when: false

    - name: Status anzeigen
      ansible.builtin.debug:
        var: moodle_ps.stdout_lines

    # Diagnose: OpenStack security group rules + port attachment are
    # confirmed correct (443/IPv6 open, group attached to the VM), so if
    # external connections still time out the remaining suspect is a
    # host-level firewall on the VM itself blocking the port before nginx
    # ever sees the packet.
    - name: Diagnose - ufw Status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Diagnose - iptables Regeln
      ansible.builtin.command: iptables -L -n -v
      register: iptables_status
      changed_when: false
      failed_when: false

    - name: Diagnose - nginx Listen-Sockets
      ansible.builtin.command: ss -tlnp
      register: ss_status
      changed_when: false
      failed_when: false

    - name: Diagnose - sites-enabled Verzeichnis
      ansible.builtin.command: ls -la /etc/nginx/sites-enabled/
      register: sites_enabled_status
      changed_when: false
      failed_when: false

    - name: Diagnose - effektive nginx-Konfiguration (server-Blöcke)
      ansible.builtin.shell:
        cmd: nginx -T 2>&1 | grep -B2 -A15 "listen.*443\|server_name"
        executable: /bin/bash
      register: nginx_effective_config
      changed_when: false
      failed_when: false

    - name: Diagnose - deployed config.php (wwwroot/sslproxy)
      ansible.builtin.shell:
        cmd: grep -n "wwwroot\|sslproxy\|reverseproxy" "{{ project_root }}/DevMoodle/moodle-docker/moodle-src/config.php"
        executable: /bin/bash
      register: config_php_diag
      changed_when: false
      failed_when: false

    - name: Diagnose - wwwroot in mdl_config (DB)
      ansible.builtin.shell:
        cmd: |
          timeout 20 docker exec moodle-docker-db-1 psql -U moodle -d moodle -t \
            -c "SELECT name, value FROM m_config WHERE name IN ('wwwroot','sessioncookie','sessioncookiepath','cookiesecure','cookiehttponly');"
        executable: /bin/bash
      register: mdl_config_diag
      changed_when: false
      failed_when: false

    - name: Diagnose - Apache error.log (letzte 50 Zeilen)
      ansible.builtin.shell:
        cmd: timeout 20 docker exec moodle-docker-webserver-1 tail -50 /var/log/apache2/error.log
        executable: /bin/bash
      register: apache_error_diag
      changed_when: false
      failed_when: false

    - name: Diagnose - VM-Ressourcen (Speicher, Load)
      ansible.builtin.shell:
        cmd: free -h && echo '---' && uptime && echo '---' && df -h /
        executable: /bin/bash
      register: resource_diag
      changed_when: false
      failed_when: false

    - name: Diagnose - lokaler curl gegen webserver-Container (127.0.0.1:8000)
      ansible.builtin.shell:
        cmd: |
          curl -s -o /dev/null -w 'http_code=%{http_code} time_total=%{time_total}s redirect_url=%{redirect_url}\n' --max-time 15 http://127.0.0.1:8000/
        executable: /bin/bash
      register: local_curl_diag
      changed_when: false
      failed_when: false

    - name: Diagnose - lokaler curl gegen nginx (localhost:443)
      ansible.builtin.shell:
        cmd: |
          curl -sk -o /dev/null -w 'http_code=%{http_code} time_total=%{time_total}s redirect_url=%{redirect_url}\n' --max-time 15 -H "Host: {{ moodle_domain }}" https://127.0.0.1:443/
        executable: /bin/bash
      register: local_nginx_curl_diag
      changed_when: false
      failed_when: false

    - name: Diagnose-Ausgabe anzeigen
      ansible.builtin.debug:
        msg:
          - "=== ufw status verbose ==="
          - "{{ ufw_status.stdout_lines | default(['(failed: ' + (ufw_status.stderr | default('unknown')) + ')']) }}"
          - "=== iptables -L -n -v ==="
          - "{{ iptables_status.stdout_lines | default(['(failed)']) }}"
          - "=== sites-enabled ==="
          - "{{ sites_enabled_status.stdout_lines | default(['(failed)']) }}"
          - "=== nginx -T (443/server_name blocks) ==="
          - "{{ nginx_effective_config.stdout_lines | default(['(failed)']) }}"
          - "=== deployed config.php (wwwroot/sslproxy/reverseproxy) ==="
          - "{{ config_php_diag.stdout_lines | default(['(failed)']) }}"
          - "=== mdl_config (wwwroot/session/cookie settings in DB) ==="
          - "{{ mdl_config_diag.stdout_lines | default(['(failed)']) }}"
          - "=== Apache error.log (last 50 lines) ==="
          - "{{ apache_error_diag.stdout_lines | default(['(failed)']) }}"
          - "=== VM resources ==="
          - "{{ resource_diag.stdout_lines | default(['(failed)']) }}"
          - "=== local curl -> webserver container (127.0.0.1:8000) ==="
          - "{{ local_curl_diag.stdout_lines | default(['(failed: ' + (local_curl_diag.stderr | default('unknown')) + ')']) }}"
          - "=== local curl -> nginx (127.0.0.1:443, Host header set) ==="
          - "{{ local_nginx_curl_diag.stdout_lines | default(['(failed: ' + (local_nginx_curl_diag.stderr | default('unknown')) + ')']) }}"
          - "=== ss -tlnp ==="
          - "{{ ss_status.stdout_lines | default(['(failed)']) }}"
