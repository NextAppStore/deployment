---
- name: 2. CONFIGURE Docker and Deploy Application on Staging Environment
  hosts: docker_vm
  become: yes
  gather_facts: yes

  vars:
    docker_users: ["ubuntu"]
    docker_install_compose: true
    project_root: "/home/ubuntu/app"
    local_compose_path: "{{ playbook_dir }}/../../"

  pre_tasks:
    - name: Verzeichnis für App erstellen
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

  roles:
    - role: geerlingguy.docker
      tags: [docker_install]

  tasks:
    - name: Docker-Compose Datei kopieren
      ansible.posix.synchronize:
        src: "{{ local_compose_path }}"
        dest: "{{ project_root }}"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.ssh"
          - "--exclude=.git"
          - "--exclude=.history"
          - "--exclude=docker-compose.override.yml"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=.venv"
          - "--exclude=.terraform"
          - "--exclude=frontend/dist"
          - "--exclude=frontend/test-results"
          - "--exclude=frontend/blob-report"
          - "--exclude=.DS_Store"
          - "--exclude=*.pyc"
          - "--exclude=.env"

    - name: .env auf VM schreiben
      ansible.builtin.copy:
        content: "{{ lookup('env', 'STAGING_ENV_FILE') }}"
        dest: "{{ project_root }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    # The staging VM's IP is dynamically allocated by OpenStack and can
    # change between deploys, but APP_BASE_URL/VITE_* in the STAGING_ENV_FILE
    # secret are static — overwrite them here with the live ansible_host so
    # the frontend/backend/Keycloak always agree on the VM's actual address.
    - name: APP_BASE_URL und VITE_* auf aktuelle VM-IP setzen
      ansible.builtin.lineinfile:
        path: "{{ project_root }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      loop:
        - { key: "APP_BASE_URL", value: "https://[{{ ansible_host }}]" }
        - { key: "VITE_APP_URL", value: "https://[{{ ansible_host }}]" }
        - { key: "VITE_API_URL", value: "https://[{{ ansible_host }}]/api" }
        - { key: "VITE_KEYCLOAK_URL", value: "https://[{{ ansible_host }}]" }
      loop_control:
        label: "{{ item.key }}"

    - name: APP_BASE_URL aus .env lesen
      ansible.builtin.shell:
        cmd: |
          grep -E '^APP_BASE_URL=' "{{ project_root }}/.env" \
            | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
        executable: /bin/bash
      register: app_base_url_raw
      changed_when: false

    # ----------------------------------------------------------------
    # TLS certificate provisioning
    #
    # Two mutually-exclusive paths, selected by whether TLS_DOMAIN is
    # set in the deployed .env:
    #   - TLS_DOMAIN set    -> ACME/DNS-01 via acme.sh against DHBW's
    #                          own ACME server (real, browser-trusted
    #                          cert).
    #   - TLS_DOMAIN empty  -> self-signed fallback (unchanged from
    #                          before), for IP-only deployments that
    #                          have no DNS name / TSIG key yet.
    # ----------------------------------------------------------------
    - name: TLS_DOMAIN aus .env lesen
      ansible.builtin.shell:
        cmd: |
          grep -E '^TLS_DOMAIN=' "{{ project_root }}/.env" \
            | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
        executable: /bin/bash
      register: tls_domain_raw
      changed_when: false

    - name: Self-signed TLS-Zertifikat generieren (falls nicht vorhanden)
      ansible.builtin.shell:
        cmd: |
          set -e
          mkdir -p {{ project_root }}/nginx/certs
          if [ ! -f {{ project_root }}/nginx/certs/cert.pem ]; then
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout {{ project_root }}/nginx/certs/key.pem \
              -out    {{ project_root }}/nginx/certs/cert.pem \
              -subj "/CN={{ ansible_host }}" \
              -addext "subjectAltName=IP:{{ ansible_host }}"
            chmod 600 {{ project_root }}/nginx/certs/key.pem
            echo "cert generated"
          else
            echo "cert exists, skipped"
          fi
        executable: /bin/bash
      register: cert_result
      changed_when: "'cert generated' in cert_result.stdout"
      when: tls_domain_raw.stdout | trim == ''

    - name: ACME-TLS-Zertifikat via acme.sh besorgen (DNS-01, DHBW ACME-Server)
      when: tls_domain_raw.stdout | trim != ''
      block:
        - name: ACME_ACCOUNT_EMAIL aus .env lesen
          ansible.builtin.shell:
            cmd: |
              grep -E '^ACME_ACCOUNT_EMAIL=' "{{ project_root }}/.env" \
                | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
            executable: /bin/bash
          register: acme_email_raw
          changed_when: false

        # DNS_TSIG_KEY is the literal BIND ``key "..." { ...; };`` clause,
        # stored in .env as a properly shell-quoted value (double-quoted,
        # embedded quotes backslash-escaped) so it also works with the
        # Makefile's `. ./.env` sourcing. A plain grep/cut (as used for the
        # simpler vars above) would leave the quoting/escaping in place, so
        # source the line through bash instead and let it do the unquoting.
        - name: DNS_TSIG_KEY aus .env lesen
          ansible.builtin.shell:
            cmd: |
              set -e
              line=$(grep -E '^DNS_TSIG_KEY=' "{{ project_root }}/.env" | head -n1 | tr -d '\r')
              eval "$line"
              printf '%s' "$DNS_TSIG_KEY"
            executable: /bin/bash
          register: dns_tsig_key_raw
          changed_when: false

        - name: ACME-Variablen setzen
          ansible.builtin.set_fact:
            tls_domain: "{{ tls_domain_raw.stdout | trim }}"
            dns_tsig_key: "{{ dns_tsig_key_raw.stdout | trim }}"
            acme_account_email: "{{ acme_email_raw.stdout | trim }}"

        - name: acme.sh installiert? prüfen
          ansible.builtin.stat:
            path: /root/.acme.sh/acme.sh
          register: acme_sh_bin

        - name: acme.sh installieren (idempotent)
          ansible.builtin.shell:
            cmd: |
              set -e
              curl -fsSL https://get.acme.sh | sh -s email={{ acme_account_email }}
            executable: /bin/bash
          when: not acme_sh_bin.stat.exists

        - name: TSIG-Key-Verzeichnis anlegen
          ansible.builtin.file:
            path: /etc/acme-dns
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: tsig.key schreiben
          ansible.builtin.copy:
            content: "{{ dns_tsig_key }}\n"
            dest: /etc/acme-dns/tsig.key
            owner: root
            group: root
            mode: '0600'

        - name: ACME-Account beim DHBW-Server registrieren (idempotent)
          ansible.builtin.shell:
            cmd: |
              /root/.acme.sh/acme.sh --register-account \
                --server https://certificates.dhbw.cloud \
                -m {{ acme_account_email }}
            executable: /bin/bash
          register: acme_register
          changed_when: "'Registering account' in acme_register.stdout"
          failed_when: acme_register.rc != 0 and 'already registered' not in acme_register.stdout

        # acme.sh tracks issuance/renewal state itself (~/.acme.sh/<domain>/),
        # so call --issue unconditionally every run rather than
        # reimplementing that check via file existence. When a cert already
        # exists and isn't due for renewal yet, acme.sh prints "Skipping"
        # and exits 2 — that's the expected steady-state outcome, not a
        # failure; only other non-zero exit codes are real errors.
        - name: Zertifikat ausstellen / erneuern (acme.sh entscheidet selbst ob nötig)
          ansible.builtin.shell:
            cmd: |
              export NSUPDATE_SERVER="ns.cloud-ns.dhbw-mannheim.de."
              export NSUPDATE_SERVER_PORT="53"
              export NSUPDATE_KEY="/etc/acme-dns/tsig.key"
              /root/.acme.sh/acme.sh --issue \
                --server https://certificates.dhbw.cloud \
                --dns dns_nsupdate \
                -d {{ tls_domain }} \
                -d www.{{ tls_domain }}
            executable: /bin/bash
          register: acme_issue
          changed_when: "'Cert success' in acme_issue.stdout"
          failed_when: acme_issue.rc not in [0, 2]

        - name: Verzeichnis nginx/certs anlegen
          ansible.builtin.file:
            path: "{{ project_root }}/nginx/certs"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: '0700'

        # The --reloadcmd's ``nginx -s reload`` can fail here on a VM
        # where nginx/certs previously had no content (or a different
        # bind-mount source) at container-start time — a bind mount
        # doesn't get remounted just because new files appear on the
        # host, so the running container still sees the old (possibly
        # empty) directory. install-cert itself always writes the files
        # to the host path correctly; only the live reload can lag, so
        # failure here is tolerated and caught by the unconditional
        # restart fallback below.
        - name: Zertifikat nach nginx/certs installieren (inkl. Reload-Hook)
          ansible.builtin.shell:
            cmd: |
              /root/.acme.sh/acme.sh --install-cert -d {{ tls_domain }} \
                --key-file       {{ project_root }}/nginx/certs/key.pem \
                --fullchain-file {{ project_root }}/nginx/certs/cert.pem \
                --reloadcmd      "docker exec nginx-prod sh -c 'nginx -t && nginx -s reload'"
            executable: /bin/bash
          register: acme_install
          changed_when: true
          failed_when: false

        - name: nginx-prod neu starten, falls Reload nach Zertifikatsinstallation fehlschlug
          ansible.builtin.shell:
            cmd: |
              if docker inspect nginx-prod >/dev/null 2>&1; then
                docker exec nginx-prod sh -c 'nginx -t' || docker restart nginx-prod
              else
                echo "nginx-prod does not exist yet, skipping (first deploy)"
              fi
            executable: /bin/bash
          register: nginx_cert_restart
          changed_when: "'nginx-prod' in nginx_cert_restart.stdout and 'does not exist yet' not in nginx_cert_restart.stdout"

        - name: Berechtigungen auf installiertes Zertifikat setzen
          ansible.builtin.file:
            path: "{{ item.path }}"
            owner: ubuntu
            group: ubuntu
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ project_root }}/nginx/certs/key.pem", mode: '0600' }
            - { path: "{{ project_root }}/nginx/certs/cert.pem", mode: '0644' }

    - name: Keycloak realm-export.json aus Template rendern
      ansible.builtin.template:
        src: "{{ local_compose_path }}/keycloak/realm-export.json.j2"
        dest: "{{ project_root }}/keycloak/realm-export.json"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      vars:
        app_base_url: "{{ app_base_url_raw.stdout | trim }}"
        app_api_url: "{{ app_base_url_raw.stdout | trim }}/api"

    # nginx.conf is bind-mounted, so Compose has no way to detect a
    # content change and recreate the container. We hash the file and
    # put the hash into a docker label via NGINX_CONFIG_HASH — when the
    # hash changes the label changes, Compose sees a spec drift and
    # recreates nginx-prod on the next ``up``.
    - name: Compute nginx config hash
      ansible.builtin.shell:
        cmd: sha256sum {{ project_root }}/nginx/nginx.conf | cut -c1-12
        executable: /bin/bash
      register: nginx_config_hash
      changed_when: false

    - name: Persist NGINX_CONFIG_HASH in .env
      ansible.builtin.lineinfile:
        path: "{{ project_root }}/.env"
        line: "NGINX_CONFIG_HASH={{ nginx_config_hash.stdout }}"
        regexp: "^NGINX_CONFIG_HASH="
        create: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Log in to GHCR using credentials from the deployed .env
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          env_file="{{ project_root }}/.env"
          token=$(grep -E '^GIT_ACCESS_TOKEN=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          user=$(grep -E '^GIT_USER=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          if [ -z "$token" ]; then
            echo "no GIT_ACCESS_TOKEN in $env_file - skipping GHCR login"
            exit 0
          fi
          echo "$token" | docker login ghcr.io --username "${user:-x}" --password-stdin
        executable: /bin/bash
      changed_when: true

    - name: Pull alle Images
      ansible.builtin.shell:
        cmd: docker compose --env-file "{{ project_root }}/.env" -f docker-compose.staging.yml pull
        chdir: "{{ project_root }}"
      changed_when: true
      async: 600
      poll: 30

    - name: GHCR credentials aus root-Store entfernen
      ansible.builtin.file:
        path: /root/.docker/config.json
        state: absent

    - name: Start the application with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        files: ["docker-compose.staging.yml"]
        pull: never
        state: present
      register: compose_output

    # Migrations live OUTSIDE the compose file on purpose: a previous
    # backend-migrate init container buried failure stderr inside the
    # compose JSON. Running alembic as its own playbook step surfaces
    # both the migration's exit code and its stderr directly in the
    # Ansible task output.
    - name: Wait for backend container to be running
      ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' backend-prod
      register: backend_running
      until: backend_running.stdout == "true"
      retries: 30
      delay: 2
      changed_when: false

    - name: Apply database migrations
      ansible.builtin.command: docker exec backend-prod python -m alembic upgrade head
      register: migration_result
      changed_when: "'Running upgrade' in migration_result.stdout"

    # Safety net for nginx.conf changes that the config_hash label
    # would normally catch — if the label-based recreate didn't fire
    # for some reason (manual edit, cache, etc.), a graceful reload
    # picks up the new config without downtime. ``-t`` validates first
    # so a broken config doesn't take nginx down.
    - name: Reload nginx config (catches volume-only changes)
      ansible.builtin.shell:
        cmd: docker exec nginx-prod sh -c 'nginx -t && nginx -s reload'
        executable: /bin/bash
      register: nginx_reload
      changed_when: "'signal process started' in nginx_reload.stdout or 'signal process started' in nginx_reload.stderr"
      failed_when: false

    - name: Status der Deployment anzeigen
      ansible.builtin.debug:
        var: compose_output